[workspace]
resolver = "3"
members = [
    "apps/cli",
    "crates/ai",
    "crates/api",
    "crates/converters",
    "crates/core",
    "crates/engine",
    "crates/ocr",
    "crates/render-markdown",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.dependencies]
base64 = "0.22.1"
clap = { version = "4.5.45", features = ["derive", "string"] }
clap_complete = "4.5.57"
directories = "6.0.0"
futures = "0.3.31"
globset = "0.4.16"
quick-xml = "=0.38.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
thiserror = "2.0.12"
toml = "0.9.5"
tempfile = "3.27.0"
url = "2.5.4"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
