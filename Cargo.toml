[workspace]
resolver = "3"
members = [
    "apps/cli",
    "crates/ai",
    "crates/asr",
    "crates/api",
    "crates/converters",
    "crates/core",
    "crates/engine",
    "crates/ffmpeg",
    "crates/http-transport",
    "crates/legacy-office",
    "crates/ocr",
    "crates/onnxruntime",
    "crates/pdf-layout",
    "crates/pdfium",
    "crates/process-plugin",
    "crates/render-markdown",
    "crates/task-store",
    "tests/contracts",
    "tools/asset-update",
    "tools/license-check",
    "tools/installed-smoke",
    "third_party/whisper-rs-0.16.0",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
axum = { version = "=0.8.4", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22.1"
calamine = { version = "=0.36.1", default-features = false, features = ["dates"] }
clap = { version = "4.5.45", features = ["derive", "string"] }
clap_complete = "4.5.57"
directories = "6.0.0"
chardetng = "0.1.17"
crc32fast = "1.5.0"
clipper2-rust = "=1.1.0"
encoding_rs = "0.8.35"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
futures = "0.3.31"
getrandom = "0.4.3"
globset = "0.4.16"
html5ever = "=0.39.0"
image = { version = "=0.25.8", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
imageproc = { version = "=0.25.0", default-features = false }
libc = "0.2.189"
libloading = "0.9.0"
md5 = { package = "md-5", version = "0.10.6" }
object = { version = "=0.40.0", default-features = false, features = ["read", "std"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "alternative-backend", "api-28"] }
prost = { version = "=0.14.4", default-features = false, features = ["derive", "std"] }
pulldown-cmark = "=0.13.4"
quick-xml = "=0.38.3"
rustls = { version = "=0.23.32", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
webpki-roots = "=1.0.3"
zeroize = "=1.8.2"
rustix = { version = "1.1.4", features = ["fs"] }
rusqlite = { version = "=0.37.0", default-features = false, features = ["backup", "bundled", "limits"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
socket2 = "0.6.5"
thiserror = "2.0.12"
tokio = { version = "=1.47.1", features = ["net", "rt-multi-thread", "signal"] }
toml = "0.9.5"
tempfile = "3.27.0"
tiff = "=0.10.3"
unicode-normalization = "0.1.25"
url = "2.5.4"
winapi-util = "0.1.11"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
