[workspace]
resolver = "3"
members = [
    "apps/cli",
    "crates/ai",
    "crates/api",
    "crates/converters",
    "crates/core",
    "crates/engine",
    "crates/ocr",
    "crates/render-markdown",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.dependencies]
futures = "0.3.31"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
