[package]
name = "into-markdown-legacy-office"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
into-markdown-core = { path = "../core" }
libc.workspace = true
libloading.workspace = true
object.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"

[[bin]]
name = "legacy-office-worker"
path = "src/bin/legacy-office-worker.rs"

[[bin]]
name = "legacy-office-test-worker"
path = "src/bin/legacy-office-test-worker.rs"
test = false
bench = false
