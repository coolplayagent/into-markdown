[package]
name = "into-markdown"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = []
official-provider-runtime = [
    "ocr-provider-runtime",
    "dep:into-markdown-asr",
    "dep:into-markdown-ffmpeg",
    "into-markdown-ocr/authenticated-read-only-snapshot",
    "into-markdown-onnxruntime/authenticated-read-only-snapshot",
]
ocr-provider-runtime = ["dep:into-markdown-onnxruntime"]
metal = ["official-provider-runtime", "into-markdown-asr/metal"]

[[test]]
name = "ppocrv6_image_quality"
path = "tests/ppocrv6_image_quality.rs"
required-features = ["ocr-provider-runtime"]

[dependencies]
into-markdown-ai = { path = "../ai" }
into-markdown-asr = { path = "../asr", optional = true }
into-markdown-converters = { path = "../converters" }
into-markdown-core = { path = "../core" }
into-markdown-engine = { path = "../engine" }
into-markdown-ffmpeg = { path = "../ffmpeg", optional = true }
into-markdown-ocr = { path = "../ocr" }
into-markdown-onnxruntime = { path = "../onnxruntime", optional = true }
into-markdown-render-markdown = { path = "../render-markdown" }
into-markdown-task-store = { path = "../task-store" }

[dev-dependencies]
image.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
zip.workspace = true

[lints]
workspace = true
