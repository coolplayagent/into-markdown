[package]
name = "installed-smoke"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "installed-smoke"
path = "src/main.rs"

[[bin]]
name = "archive-check"
path = "src/bin/archive-check.rs"

[dependencies]
clap.workspace = true
license-check = { path = "../license-check" }
into-markdown-converters = { path = "../../crates/converters" }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
zip.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
