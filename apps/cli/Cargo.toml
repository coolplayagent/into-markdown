[package]
name = "into-markdown-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = []
metal = ["into-markdown/metal"]
plugin-manager-fault-injection = ["into-markdown-plugin-manager/fault-injection"]

[[bin]]
name = "into-md"
path = "src/main.rs"

[dependencies]
axum.workspace = true
base64.workspace = true
cap-std.workspace = true
clap.workspace = true
clap_complete.workspace = true
directories.workspace = true
futures.workspace = true
getrandom.workspace = true
globset.workspace = true
into-markdown = { path = "../../crates/api" }
into-markdown-http-transport = { path = "../../crates/http-transport" }
into-markdown-plugin-manager = { path = "../../crates/plugin-manager" }
into-markdown-plugin-wasi = { path = "../../crates/plugin-wasi" }
into-markdown-process-plugin = { path = "../../crates/process-plugin" }
into-markdown-provider-plugin = { path = "../../crates/provider-plugin" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
toml.workspace = true
tempfile.workspace = true
thiserror.workspace = true
url.workspace = true
zip.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
winapi-util.workspace = true

[dev-dependencies]
pulldown-cmark.workspace = true
ring.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "sync"] }

[lints]
workspace = true
