name: Legacy XLS quality

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Audited baseline commit for the controlled real-corpus gate
        required: false
        type: string

permissions:
  contents: read

jobs:
  public-content-oracle:
    name: Public XLS content and isolation gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - name: Install the independent XLS oracle
        run: python3 -m pip install --disable-pip-version-check xlrd==2.0.2
      - name: Build the candidate CLI
        run: cargo build --locked --release -p into-markdown-cli
      - name: Verify strict and best-effort public XLS content
        run: >-
          python3 tools/legacy-xls-public-quality.py
          --cli target/release/into-md
          --fixture tools/macos-release/fixtures/normal.xls
          --output "$RUNNER_TEMP/legacy-xls-public-quality.json"
      - name: Prove DOC and PPT remain strict under best-effort policy
        run: >-
          cargo test --locked -p into-markdown-converters
          legacy_office::native_tests::doc_and_ppt_keep_strict_cfb_validation_in_best_effort
          -- --exact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-xls-public-quality
          path: ${{ runner.temp }}/legacy-xls-public-quality.json
          if-no-files-found: error

  controlled-real-corpus:
    name: Controlled 60-file XLS corpus
    if: github.event_name == 'workflow_dispatch'
    environment: release
    runs-on: [self-hosted, legacy-xls-corpus]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - name: Validate controlled runner inputs
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          XLS_CORPUS: ${{ vars.LEGACY_XLS_CORPUS }}
          XLS_XLRD_PATH: ${{ vars.LEGACY_XLS_XLRD_PATH }}
        run: |
          test -n "$BASE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          test -d "$XLS_CORPUS"
          test -d "$XLS_XLRD_PATH"
      - name: Build baseline and candidate
        env:
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          cargo build --locked --release -p into-markdown-cli
          git worktree add --detach "$RUNNER_TEMP/legacy-xls-base" "$BASE_SHA"
          trap 'git worktree remove --force "$RUNNER_TEMP/legacy-xls-base"' EXIT
          cargo build --locked --release -p into-markdown-cli \
            --manifest-path "$RUNNER_TEMP/legacy-xls-base/Cargo.toml" \
            --target-dir "$RUNNER_TEMP/legacy-xls-base-target"
      - name: Run alternating real-corpus quality and performance gates
        env:
          XLS_CORPUS: ${{ vars.LEGACY_XLS_CORPUS }}
          XLS_XLRD_PATH: ${{ vars.LEGACY_XLS_XLRD_PATH }}
        run: >-
          python3 tools/legacy-office-performance.py
          --baseline-cli "$RUNNER_TEMP/legacy-xls-base-target/release/into-md"
          --candidate-cli target/release/into-md
          --fixtures tools/macos-release/fixtures
          --xls-corpus "$XLS_CORPUS"
          --xls-authority tools/legacy-xls-corpus-authority.json
          --xls-xlrd-path "$XLS_XLRD_PATH"
          --output "$RUNNER_TEMP/legacy-xls-controlled-quality.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-xls-controlled-quality
          path: ${{ runner.temp }}/legacy-xls-controlled-quality.json
          if-no-files-found: error
