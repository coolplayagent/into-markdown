name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bazel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos_arm64
          - os: ubuntu-24.04
            platform: linux_x86_64
          - os: ubuntu-24.04-arm
            platform: linux_arm64
          - os: windows-2025
            platform: windows_x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ runner.os }}-${{ matrix.platform }}
          repository-cache: true
      - name: Build
        run: bazel build --config=${{ matrix.platform }} //...
      - name: Test
        run: bazel test --config=${{ matrix.platform }} //...

  cargo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Audit release licenses
        run: cargo run --locked --offline -p license-check -- release
