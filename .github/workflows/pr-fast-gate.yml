name: PR fast gate

on:
  pull_request:

concurrency:
  group: pr-fast-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-x86-64:
    name: Linux x86_64, shared tests, and Web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target
          key: pr-fast-linux-x86-64-${{ hashFiles('Cargo.lock') }}
      - name: Check shared Rust and release contracts
        run: |
          cargo fmt --all -- --check
          cargo test --locked -p into-markdown-core -p into-markdown-layout-quality -p into-markdown-ocr --lib -j2
          cargo test --locked -p into-markdown-process-plugin --lib --test runtime -j2 -- --test-threads=1
          python -m unittest \
            tools.platform-release.test_release \
            tools.portable-release.test_assemble \
            tools.portable-release.test_native_acceptance \
            tools.release_evidence_test \
            tools.release_metadata_test \
            tools.skill-release.test_skill_release
      - name: Build the checked production Web bundle without Bazel
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
          node web/console/tests/typecheck.mjs
          node web/console/build.mjs "${{ runner.temp }}/web-dist" --verify web/console/dist

  linux-arm64:
    name: Linux ARM64 Core
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target
          key: pr-fast-linux-arm64-${{ hashFiles('Cargo.lock') }}
      - name: Compile and test the native Core path
        run: cargo test --locked -p into-markdown-cli --bin into-md -j2

  windows-x86-64:
    name: Windows x86_64 Core
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target
          key: pr-fast-windows-x86-64-${{ hashFiles('Cargo.lock') }}
      - name: Test the native Core and portable archive authority
        run: |
          cargo test --locked -p into-markdown-cli --bin into-md -j2
          python tools/portable-release/test_assemble.py

  macos-arm64:
    name: macOS ARM64 Core
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target
          key: pr-fast-macos-arm64-${{ hashFiles('Cargo.lock') }}
      - name: Test the native Core path
        run: cargo test --locked -p into-markdown-cli --bin into-md -j2
