name: PR fast gate

on:
  pull_request:

concurrency:
  group: pr-fast-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TERM_COLOR: always

jobs:
  linux-x86-64:
    name: Linux x86_64, shared tests, and Web
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check ratcheting production-code structure
        env:
          STRUCTURE_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$STRUCTURE_BASE"
          python3 -m pip install --disable-pip-version-check --only-binary=:all: -r tools/structure_gate/requirements.txt
          python3 -m unittest discover -s tools/structure_gate/tests -v
          python3 -m tools.structure_gate check --base-ref "$STRUCTURE_BASE"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target
          key: pr-fast-v2-linux-x86-64-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            pr-fast-v2-linux-x86-64-
            pr-fast-linux-x86-64-${{ hashFiles('Cargo.lock') }}
      - name: Test shared Rust and release contracts once
        run: |
          cargo fmt --all -- --check
          cargo test --locked -p into-markdown-core -p into-markdown-layout-quality -p into-markdown-ocr --lib -j2 -- \
            --skip recognition::tests::all_exif_orientations_flow_from_detection_to_raw_source_recognition
          cargo test --locked -p into-markdown-process-plugin --lib -j2
          python3 tools/platform-release/pr_fast_gate.py --target x86_64-unknown-linux-gnu
          python3 -m unittest \
            tools.platform-release.test_release \
            tools.platform-release.test_pr_fast_gate \
            tools.portable-release.test_assemble \
            tools.portable-release.test_native_acceptance \
            tools.portable-release.test_post_release_e2e \
            tools.release_evidence_test \
            tools.release_metadata_test \
            tools.skill-release.test_skill_release
      - name: Build the checked production Web bundle
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
          node web/console/tests/typecheck.mjs
          node web/console/build.mjs "${{ runner.temp }}/web-dist" --verify web/console/dist

  linux-arm64:
    name: Linux ARM64 Core
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target
          key: pr-fast-v2-linux-arm64-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            pr-fast-v2-linux-arm64-
            pr-fast-linux-arm64-${{ hashFiles('Cargo.lock') }}
      - name: Compile the native process boundary and validate release authority
        run: |
          cargo check --locked -p into-markdown-process-plugin --lib -j2
          python3 tools/platform-release/pr_fast_gate.py --target aarch64-unknown-linux-gnu

  windows-x86-64:
    name: Windows x86_64 Core
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target
          key: pr-fast-v2-windows-x86-64-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            pr-fast-v2-windows-x86-64-
            pr-fast-windows-x86-64-${{ hashFiles('Cargo.lock') }}
      - name: Compile the native process boundary and validate release authority
        run: |
          cargo check --locked -p into-markdown-process-plugin --lib -j2
          python tools/platform-release/pr_fast_gate.py --target x86_64-pc-windows-msvc

  macos-arm64:
    name: macOS ARM64 Core
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target
          key: pr-fast-v2-macos-arm64-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            pr-fast-v2-macos-arm64-
            pr-fast-macos-arm64-${{ hashFiles('Cargo.lock') }}
      - name: Compile the native process boundary and validate release authority
        run: |
          cargo check --locked -p into-markdown-process-plugin --lib -j2
          python3 tools/platform-release/pr_fast_gate.py --target aarch64-apple-darwin
