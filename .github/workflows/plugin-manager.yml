name: plugin-manager

on:
  pull_request:
    paths:
      - "crates/plugin-manager/**"
      - "crates/http-transport/**"
      - "crates/process-plugin/**"
      - "crates/plugin-wasi/**"
      - "apps/cli/**"
      - "web/console/**"
      - "docs/ui.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "third_party/licenses/**"
      - "tools/license-check/**"
      - ".github/workflows/plugin-manager.yml"
  push:
    paths:
      - "crates/plugin-manager/**"
      - "crates/http-transport/**"
      - "crates/process-plugin/**"
      - "crates/plugin-wasi/**"
      - "apps/cli/**"
      - "web/console/**"
      - "docs/ui.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "third_party/licenses/**"
      - "tools/license-check/**"
      - ".github/workflows/plugin-manager.yml"

permissions:
  contents: read

jobs:
  authority:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true
      - name: Validate Cargo runtime authority mutations
        run: |
          cargo fetch --locked
          cargo test --locked -p license-check normal_runtime_authority_matches_locked_metadata -j1
          cargo test --locked -p license-check normal_runtime_authority_rejects_overlap_and_omission -j1
          cargo test --locked -p license-check normal_runtime_authority_rejects_kind_reclassification -j1
          cargo test --locked -p license-check normal_runtime_authority_rejects_manifest_set_drift -j1
          cargo test --locked -p license-check normal_runtime_authority_rejects_manifest_hash_drift -j1
      - name: Verify deterministic console assets and npm SPDX authority
        run: |
          bazel build //web/console:assets //web/console:determinism_test \
            --jobs=1 --local_resources=memory=4096
          bazel test //web/console:admin_unit_test //web/console:dist_integration_test \
            --jobs=1 --local_resources=memory=4096 --test_output=errors
          cargo test --locked -p license-check npm_spdx_deletion_drift_duplicate_and_dangling_relationship_are_rejected -j1
  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - name: Run plugin manager and transport tests
        run: cargo test --locked -p into-markdown-plugin-manager -p into-markdown-http-transport --target ${{ matrix.target }} -j1
      - name: Run CLI plugin scope and recovery tests
        run: |
          cargo test --locked -p into-markdown-cli --bin into-md --target ${{ matrix.target }} -j1 plugin -- --test-threads=1
          cargo test --locked -p into-markdown-cli --bin into-md --target ${{ matrix.target }} -j1 joint_transaction -- --test-threads=1
          cargo test --locked -p into-markdown-cli --bin into-md --features plugin-manager-fault-injection --target ${{ matrix.target }} -j1 plugin_joint_trust_indeterminate -- --test-threads=1
          cargo test --locked -p into-markdown-cli --bin into-md --target ${{ matrix.target }} -j1 transaction::windows_config_tests -- --test-threads=1
          cargo test --locked -p into-markdown-cli --test exit_contract --target ${{ matrix.target }} -j1 plugin_list_uses_only_isolated_production_user_data -- --exact --test-threads=1
      - name: Run bounded administration service and route tests
        run: |
          cargo test --locked -p into-markdown-cli --bin into-md --target ${{ matrix.target }} -j1 admin::tests -- --test-threads=1
          cargo test --locked -p into-markdown-cli --bin into-md --target ${{ matrix.target }} -j1 ui::tests::administration_gate_bounds_snapshot_grant_and_action_and_releases -- --exact --test-threads=1
      - name: Run real administration HTTP session boundary
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: cargo test --locked -p into-markdown-cli --bin into-md --target ${{ matrix.target }} -j1 ui::tests::administration_snapshot_reuses_session_boundary_and_actions_require_grants -- --exact --test-threads=1
      - name: Run process plugin fixture
        run: cargo test --locked -p into-markdown-process-plugin --test runtime --target ${{ matrix.target }} -j1
      - name: Run isolated real CLI plugin lifecycle
        shell: bash
        run: |
          cargo build --locked -p into-markdown-plugin-manager --bin plugin_manager_process_fixture --target ${{ matrix.target }} -j1
          fixture="plugin_manager_process_fixture"
          if [[ "${{ runner.os }}" == "Windows" ]]; then fixture="${fixture}.exe"; fi
          export INTO_MD_PLUGIN_PROCESS_FIXTURE="$PWD/target/${{ matrix.target }}/debug/$fixture"
          cargo test --locked -p into-markdown-cli --test plugin_lifecycle --target ${{ matrix.target }} -j1 -- --test-threads=1
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: plugin-manager-${{ matrix.target }}
          repository-cache: true
      - name: Run Bazel plugin-manager target
        shell: bash
        run: |
          bazel build //apps/cli:into-md --jobs=1 --local_resources=memory=4096
          bazel test //crates/plugin-manager:plugin_manager_test //crates/plugin-manager:plugin_manager_process_e2e_test \
            --jobs=1 --local_resources=memory=4096 --test_output=errors
          bazel test //apps/cli:plugin_lifecycle_test \
            --jobs=1 --local_resources=memory=4096 --test_output=errors
          bazel test //web/console:admin_unit_test //web/console:dist_integration_test \
            --jobs=1 --local_resources=memory=4096 --test_output=errors
      - name: Rebuild and run WASI fixture
        shell: bash
        run: |
          rustup target add wasm32-wasip2
          python crates/plugin-wasi/tests/verify_fixture.py --rebuild
          cargo test --locked -p into-markdown-plugin-wasi --test runtime --target ${{ matrix.target }} -j1
