name: Native release gates

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      target:
        required: true
        type: string
      container:
        required: true
        type: string
      bazel_config:
        required: true
        type: string

permissions:
  contents: read

jobs:
  native-gates:
    runs-on: ${{ inputs.runner }}
    container: ${{ inputs.container }}
    timeout-minutes: 180
    steps:
      - name: Bootstrap fixed Linux gate container
        if: runner.os == 'Linux'
        run: |
          dnf install --assumeyes curl gcc git
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"
      - uses: actions/checkout@v4
      - name: Bind fixed Linux checkout ownership
        if: runner.os == 'Linux'
        run: |
          git config --global --unset-all safe.directory || true
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse --show-toplevel)" = "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Run target-native Clippy and Bazel gates
        run: |
          cargo test --locked -p into-markdown-process-plugin --test runtime declared_child_process_can_execute_an_authenticated_runtime_helper -- --exact --nocapture
