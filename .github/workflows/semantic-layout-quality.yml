name: Semantic layout quality

on:
  pull_request:
    paths:
      - "crates/core/**"
      - "crates/api/**"
      - "crates/converters/**"
      - "crates/layout-quality/**"
      - "crates/ocr/**"
      - "crates/onnxruntime/**"
      - "crates/render-markdown/**"
      - "fixtures/**"
      - "fuzz/legacy-office/**"
      - "tools/macos-release/fixtures/**"
      - "tools/legacy-office-performance.py"
      - "models/**"
      - "third_party/onnxruntime/**"
      - "third_party/pdfium/**"
      - "docs/architecture.md"
      - "docs/semantic-layout-quality.md"
      - "docs/testing.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - ".github/workflows/semantic-layout-quality.yml"
  push:
    branches: [main]
    paths:
      - "crates/core/**"
      - "crates/api/**"
      - "crates/converters/**"
      - "crates/layout-quality/**"
      - "crates/ocr/**"
      - "crates/onnxruntime/**"
      - "crates/render-markdown/**"
      - "fixtures/**"
      - "fuzz/legacy-office/**"
      - "tools/macos-release/fixtures/**"
      - "tools/legacy-office-performance.py"
      - "models/**"
      - "third_party/onnxruntime/**"
      - "third_party/pdfium/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/semantic-layout-quality.yml"

permissions:
  contents: read

jobs:
  five-target-golden:
    name: ${{ matrix.config }} normalized IR and GFM
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            config: macos_arm64
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            config: linux_x86_64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            config: linux_arm64
            target: aarch64-unknown-linux-gnu
          - os: windows-2025
            config: windows_x86_64
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            config: windows_arm64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: semantic-layout-${{ matrix.config }}
          repository-cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - name: Run the bounded quality engine and real converter goldens with Cargo
        run: >-
          cargo test --locked --target ${{ matrix.target }} -j1
          -p into-markdown-layout-quality
      - name: Run the same quality boundary through Bazel
        run: >-
          bazel --output_user_root="${{ runner.temp }}/bazel" test --config=${{ matrix.config }} --lockfile_mode=error
          //crates/layout-quality:layout_quality_test
          //crates/layout-quality:semantic_layout_quality
          //crates/converters:converters_test
          //crates/pdf-layout:pdf_layout_test
          //crates/converters:pdf_layout_quality
          //crates/api:ppocrv6_image_quality
          --jobs=1 --local_resources=memory=4096 --test_output=errors
      - name: Run the OCR merge and runtime regressions
        run: >-
          bazel --output_user_root="${{ runner.temp }}/bazel" test --config=${{ matrix.config }} --lockfile_mode=error
          //crates/ocr:ocr_test
          --jobs=1 --local_resources=memory=4096 --test_output=errors

  repository-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bazel-contrib/setup-bazel@0.15.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Check formatting and strict lints
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked -p into-markdown-layout-quality --all-targets --no-deps -- -D warnings
          cargo clippy --locked -p into-markdown-converters --all-targets --no-deps -- -D warnings
      - name: Check the locked Cargo license authority integration
        run: |
          cargo fetch --locked
          cargo test --locked -p license-check normal_runtime_authority_matches_locked_metadata -j1
      - name: Verify and smoke the native legacy Office fuzz targets
        run: |
          python3 tools/macos-release/fixtures/generate.py --check
          rustup toolchain install nightly-2026-08-20 --profile minimal
          cargo install cargo-fuzz --locked --version 0.13.1
          cargo +nightly-2026-08-20 fuzz run --fuzz-dir fuzz/legacy-office legacy_doc fuzz/legacy-office/corpus/legacy_doc tools/macos-release/fixtures -- -runs=256
          cargo +nightly-2026-08-20 fuzz run --fuzz-dir fuzz/legacy-office legacy_ppt fuzz/legacy-office/corpus/legacy_ppt tools/macos-release/fixtures -- -runs=256
          cargo +nightly-2026-08-20 fuzz run --fuzz-dir fuzz/legacy-office legacy_xls fuzz/legacy-office/corpus/legacy_xls tools/macos-release/fixtures -- -runs=256
      - name: Compare baseline and native Core performance on the same runner
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          cargo build --locked --release -p into-markdown-cli
          candidate_cli=$(realpath target/release/into-md)
          base_sha="$PR_BASE_SHA"
          if [ -z "$base_sha" ]; then base_sha="$PUSH_BASE_SHA"; fi
          if ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then base_sha=HEAD^; fi
          git worktree add --detach "$RUNNER_TEMP/into-md-performance-base" "$base_sha"
          trap 'git worktree remove --force "$RUNNER_TEMP/into-md-performance-base"' EXIT
          cargo build --locked --release -p into-markdown-cli \
            --manifest-path "$RUNNER_TEMP/into-md-performance-base/Cargo.toml" \
            --target-dir "$RUNNER_TEMP/into-md-performance-base-target"
          python3 tools/legacy-office-performance.py \
            --baseline-cli "$RUNNER_TEMP/into-md-performance-base-target/release/into-md" \
            --candidate-cli "$candidate_cli" \
            --fixtures tools/macos-release/fixtures \
            --output "$RUNNER_TEMP/legacy-office-performance.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-office-performance-linux-x86_64
          path: ${{ runner.temp }}/legacy-office-performance.json
          if-no-files-found: error
