name: PDFium artifact audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  static-four-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install cross-format binary inspection tools
        run: sudo apt-get update && sudo apt-get install --yes llvm
      - name: Audit pinned archives, libraries, formats, licenses, and ABI exports
        env:
          PDFIUM_AUDIT_NETWORK: "1"
        run: ./tools/pdfium-audit.sh

  native-macos-arm64:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Audit artifacts and run production-loader smoke test
        env:
          PDFIUM_AUDIT_NETWORK: "1"
          PDFIUM_NATIVE_SMOKE: "1"
        run: ./tools/pdfium-audit.sh --native-smoke
