name: macOS ARM64 modular release

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      release_version:
        required: true
        type: string
      signing_mode:
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-14
    environment: release
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Validate immutable release URL authority
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._+-]{0,127}", tag):
              raise SystemExit("release tag must be a bounded URL-safe Git ref component")
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
      - name: Activate fixed pnpm toolchain
        run: |
          corepack enable
          corepack pnpm --version
      - name: Validate release assembly and metadata contracts
        run: |
          python3 -m unittest discover -s tools/macos-release -p '*test.py'
          python3 -m unittest tools.publish_release_assets_test tools.release_metadata_test tools.release_signing_policy_test tools.release_version_test tools.finalize_release_test tools.release_workflow_test
      - name: Build audited LGPL FFmpeg runtime
        env:
          FFMPEG_AUDIT_NETWORK: "1"
          FFMPEG_AUDIT_OUTPUT_DIR: ${{ runner.temp }}/ffmpeg-audit
        run: |
          brew install gnupg
          ./tools/ffmpeg-build-audit.sh
      - name: Build Core and two self-contained plugins twice
        env:
          PLUGIN_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ inputs.release_tag }}
          PLUGIN_SIGNING_KEY_BASE64: ${{ secrets.PLUGIN_SIGNING_KEY_BASE64 }}
        run: |
          umask 077
          test -n "$PLUGIN_SIGNING_KEY_BASE64"
          printf '%s' "$PLUGIN_SIGNING_KEY_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/official-plugin-signing-key.pk8"
          for sample in a b; do
            PYTHONPATH=tools/macos-release python3 tools/macos-release/release.py \
              --version "${{ inputs.release_version }}" \
              --output "$RUNNER_TEMP/core-stage-$sample" \
              --cache "$RUNNER_TEMP/release-cache" \
              --build-root "$RUNNER_TEMP/build-$sample" \
              --ffmpeg-artifacts "$RUNNER_TEMP/ffmpeg-audit" \
              --plugin-signing-key "$RUNNER_TEMP/official-plugin-signing-key.pk8" \
              --plugin-base-url "$PLUGIN_BASE_URL" \
              --plugins-output "$RUNNER_TEMP/plugins-$sample" \
              --archive "$RUNNER_TEMP/into-md-macos-arm64-core-$sample.tar.gz"
          done
          cmp "$RUNNER_TEMP/into-md-macos-arm64-core-a.tar.gz" \
            "$RUNNER_TEMP/into-md-macos-arm64-core-b.tar.gz"
          for package in official.ocr.ppocrv6 official.media.whisper; do
            cmp "$RUNNER_TEMP/plugins-a/$package.imp" "$RUNNER_TEMP/plugins-b/$package.imp"
          done
      - name: Import protected Apple signing and notarization credentials
        if: inputs.signing_mode == 'signed'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          RELEASE_KEYCHAIN_PASSWORD: ${{ secrets.RELEASE_KEYCHAIN_PASSWORD }}
        run: |
          set -eu
          test -n "$APPLE_CERTIFICATE_P12_BASE64"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_NOTARY_KEY_BASE64"
          test -n "$RELEASE_KEYCHAIN_PASSWORD"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$APPLE_NOTARY_KEY_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/notary-key.p8"
          security create-keychain -p "$RELEASE_KEYCHAIN_PASSWORD" \
            "$RUNNER_TEMP/release.keychain-db"
          security unlock-keychain -p "$RELEASE_KEYCHAIN_PASSWORD" \
            "$RUNNER_TEMP/release.keychain-db"
          security import "$RUNNER_TEMP/developer-id.p12" \
            -k "$RUNNER_TEMP/release.keychain-db" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$RELEASE_KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/release.keychain-db"
      - name: Assemble Developer ID signed release artifacts
        if: inputs.signing_mode == 'signed'
        env:
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          PLUGIN_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ inputs.release_tag }}
        run: |
          set -eu
          test -n "$APPLE_CODESIGN_IDENTITY"
          PYTHONPATH=tools/macos-release python3 tools/macos-release/release.py \
            --version "${{ inputs.release_version }}" \
            --output "$RUNNER_TEMP/core-stage-final" \
            --cache "$RUNNER_TEMP/release-cache" \
            --build-root "$RUNNER_TEMP/build-a" \
            --skip-build \
            --ffmpeg-artifacts "$RUNNER_TEMP/ffmpeg-audit" \
            --plugin-signing-key "$RUNNER_TEMP/official-plugin-signing-key.pk8" \
            --plugin-base-url "$PLUGIN_BASE_URL" \
            --plugins-output "$RUNNER_TEMP/plugins-final" \
            --archive "$RUNNER_TEMP/into-md-macos-arm64-core-signed.tar.gz" \
            --codesign-identity "$APPLE_CODESIGN_IDENTITY" \
            --audit-report "$RUNNER_TEMP/platform-audit.json"
          hdiutil create -quiet -fs HFS+ -format UDZO \
            -volname "into-markdown" \
            -srcfolder "$RUNNER_TEMP/core-stage-final" \
            "$RUNNER_TEMP/into-md-macos-arm64-core.dmg"
          /usr/bin/codesign --force --sign "$APPLE_CODESIGN_IDENTITY" \
            --timestamp --options runtime "$RUNNER_TEMP/into-md-macos-arm64-core.dmg"
          /usr/bin/codesign --verify --strict --verbose=2 \
            "$RUNNER_TEMP/into-md-macos-arm64-core.dmg"
      - name: Assemble installable unsigned release artifacts
        if: inputs.signing_mode == 'unsigned'
        env:
          PLUGIN_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ inputs.release_tag }}
        run: |
          set -eu
          PYTHONPATH=tools/macos-release python3 tools/macos-release/release.py \
            --version "${{ inputs.release_version }}" \
            --output "$RUNNER_TEMP/core-stage-final" \
            --cache "$RUNNER_TEMP/release-cache" \
            --build-root "$RUNNER_TEMP/build-a" \
            --skip-build \
            --ffmpeg-artifacts "$RUNNER_TEMP/ffmpeg-audit" \
            --plugin-signing-key "$RUNNER_TEMP/official-plugin-signing-key.pk8" \
            --plugin-base-url "$PLUGIN_BASE_URL" \
            --plugins-output "$RUNNER_TEMP/plugins-final" \
            --archive "$RUNNER_TEMP/into-md-macos-arm64-core-unsigned.tar.gz" \
            --codesign-identity "-" \
            --audit-report "$RUNNER_TEMP/platform-audit.json"
          hdiutil create -quiet -fs HFS+ -format UDZO \
            -volname "into-markdown" \
            -srcfolder "$RUNNER_TEMP/core-stage-final" \
            "$RUNNER_TEMP/into-md-macos-arm64-core.dmg"
          /usr/bin/codesign --force --sign - "$RUNNER_TEMP/into-md-macos-arm64-core.dmg"
          /usr/bin/codesign --verify --strict --verbose=2 \
            "$RUNNER_TEMP/into-md-macos-arm64-core.dmg"
      - name: Notarize Core and two capability plugins
        if: inputs.signing_mode == 'signed'
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -eu
          test -n "$APPLE_NOTARY_KEY_ID"
          test -n "$APPLE_NOTARY_ISSUER_ID"
          xcrun notarytool submit "$RUNNER_TEMP/into-md-macos-arm64-core.dmg" \
            --key "$RUNNER_TEMP/notary-key.p8" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" --wait
          xcrun stapler staple "$RUNNER_TEMP/into-md-macos-arm64-core.dmg"
          xcrun stapler validate "$RUNNER_TEMP/into-md-macos-arm64-core.dmg"
          for package in official.ocr.ppocrv6 official.media.whisper; do
            cp "$RUNNER_TEMP/plugins-final/$package.imp" "$RUNNER_TEMP/$package.zip"
            xcrun notarytool submit "$RUNNER_TEMP/$package.zip" \
              --key "$RUNNER_TEMP/notary-key.p8" \
              --key-id "$APPLE_NOTARY_KEY_ID" \
              --issuer "$APPLE_NOTARY_ISSUER_ID" --wait
            rm "$RUNNER_TEMP/$package.zip"
          done
      - name: Record final Core digest and external signing policy
        run: |
          core_sha=$(shasum -a 256 "$RUNNER_TEMP/into-md-macos-arm64-core.dmg" | awk '{print $1}')
          printf '%s  %s\n' "$core_sha" "into-md-macos-arm64-core.dmg" \
            > "$RUNNER_TEMP/into-md-macos-arm64-core.dmg.sha256"
          python3 tools/release-signing-policy.py \
            --target aarch64-apple-darwin \
            --mode "${{ inputs.signing_mode }}" \
            --source-revision "${{ github.sha }}" \
            --output "$RUNNER_TEMP/aarch64-apple-darwin-signing-policy.json"
      - name: Generate and externally validate release SBOMs
        run: |
          set -eu
          metadata="$RUNNER_TEMP/release-metadata"
          mount="$RUNNER_TEMP/core-dmg-readonly"
          mkdir "$mount"
          python3 tools/publish_release_assets.py \
            --source "$RUNNER_TEMP/plugins-final" \
            --output "$RUNNER_TEMP/published-plugins" \
            --target aarch64-apple-darwin
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" \
            "$RUNNER_TEMP/into-md-macos-arm64-core.dmg"
          trap 'hdiutil detach "$mount"' EXIT
          "$mount/bin/archive-check" "$mount"
          python3 tools/release-metadata.py \
            --projection-tool "$RUNNER_TEMP/build-a/release/release-projection" \
            --target aarch64-apple-darwin \
            --version "${{ inputs.release_version }}" \
            --source-revision "${{ github.sha }}" \
            --core-artifact "$RUNNER_TEMP/into-md-macos-arm64-core.dmg" \
            --core-root "$mount" \
            --plugins "$RUNNER_TEMP/published-plugins" \
            --output "$metadata"
          hdiutil detach "$mount"
          trap - EXIT
          wheel="$RUNNER_TEMP/spdx_tools-0.8.3-py3-none-any.whl"
          python3 -m pip download --no-deps --only-binary=:all: \
            spdx-tools==0.8.3 --dest "$RUNNER_TEMP"
          test "$(shasum -a 256 "$wheel" | awk '{print $1}')" = \
            638fd9bd8be61901316eb6d063574e16d5403a1870073ec4d9241426a997501a
          spdx_venv="$RUNNER_TEMP/spdx-validation-venv"
          python3 -m venv "$spdx_venv"
          "$spdx_venv/bin/python" -m pip install "$wheel"
          for document in "$metadata"/*.spdx.json; do
            "$spdx_venv/bin/pyspdxtools" -i "$document"
          done
      - name: Verify final clean install and plugin lifecycle
        run: |
          mkdir -p "$HOME/.agents/skills/existing-skill"
          printf '%s\n' 'preserve user-owned skill' > "$HOME/.agents/skills/existing-skill/SENTINEL"
          cp -R "$HOME/.agents/skills" "$RUNNER_TEMP/agent-skills-before"
          archive="$RUNNER_TEMP/into-md-macos-arm64-core.dmg"
          distribution="$RUNNER_TEMP/distribution-core"
          mkdir "$distribution"
          hdiutil attach -quiet -nobrowse -readonly -mountpoint "$distribution" "$archive"
          trap 'hdiutil detach -quiet "$RUNNER_TEMP/distribution-core" || true' EXIT
          "$distribution/bin/archive-check" "$distribution"
          installed=$(
            "$distribution/install" "$RUNNER_TEMP/install-core" "$RUNNER_TEMP/bin-core" | tail -1
          )
          diff -ru "$RUNNER_TEMP/agent-skills-before" "$HOME/.agents/skills"
          diff -ru ".agents/skills/into-markdown" \
            "$installed/share/into-markdown/skills/into-markdown"
          export INTO_MARKDOWN_USER_DATA_HOME="$RUNNER_TEMP/clean-user-data"
          mkdir -m 700 "$INTO_MARKDOWN_USER_DATA_HOME"
          mkdir -p "$RUNNER_TEMP/smoke-core"
          signer_id=$(jq -r '.signingKeyId' "$installed/share/into-markdown/plugins/official-publisher.json")
          signer_sha=$(jq -r '.signingKeySha256' "$installed/share/into-markdown/plugins/official-publisher.json")
          for package in official.ocr.ppocrv6 official.media.whisper; do
            sha=$(shasum -a 256 "$RUNNER_TEMP/plugins-final/$package.imp" | awk '{print $1}')
            "$installed/bin/into-md" plugins install "$RUNNER_TEMP/plugins-final/$package.imp" \
              --sha256 "$sha" --signing-key-id "$signer_id" \
              --signing-key-sha256 "$signer_sha" --scope global
            "$installed/bin/into-md" plugins verify "$package" --scope global
          done
          "$installed/bin/into-md" capabilities list --json | jq -e \
            '[.capabilities[] | select(.status == "ready")] | length == 3'
          archive_sha=$(shasum -a 256 "$archive" | awk '{print $1}')
          "$installed/bin/installed-smoke" \
            --install-root "$installed" \
            --into-md "$installed/bin/into-md" \
            --rust-library "$installed/lib/into-markdown-rust" \
            --manifest "$installed/archive-manifest.json" \
            --fixtures "$installed/share/into-markdown/smoke/fixtures" \
            --audio-fixture "$GITHUB_WORKSPACE/fixtures/asr-quality/source/en-clear.wav" \
            --temp-root "$RUNNER_TEMP/smoke-core" \
            --report "$RUNNER_TEMP/installed-smoke.json" \
            --archive-sha256 "$archive_sha" \
            --cargo "$(rustup which cargo)" \
            --rustc "$(rustup which rustc)" \
            --pdfium-library "$installed/lib/pdfium/libpdfium.dylib" \
            --timeout-seconds 90
          python3 tools/platform-release/platform_acceptance.py \
            --target aarch64-apple-darwin \
            --install-root "$installed" \
            --into-md "$installed/bin/into-md" \
            --plugins "$RUNNER_TEMP/plugins-final" \
            --publisher "$installed/share/into-markdown/plugins/official-publisher.json" \
            --fixtures "$installed/share/into-markdown/smoke/fixtures" \
            --audio-fixture "$GITHUB_WORKSPACE/fixtures/asr-quality/source/en-clear.wav" \
            --work-root "$RUNNER_TEMP/platform-acceptance-state" \
            --archive-sha256 "$archive_sha" \
            --platform-audit "$RUNNER_TEMP/platform-audit.json" \
            --report "$RUNNER_TEMP/platform-acceptance.json" \
            --timeout-seconds 900
          "$distribution/uninstall" "$RUNNER_TEMP/install-core" "$RUNNER_TEMP/bin-core"
          diff -ru "$RUNNER_TEMP/agent-skills-before" "$HOME/.agents/skills"
          hdiutil detach -quiet "$distribution"
          trap - EXIT
      - uses: actions/upload-artifact@v4
        with:
          name: into-md-macos-arm64-modular
          path: |
            ${{ runner.temp }}/into-md-macos-arm64-core.dmg
            ${{ runner.temp }}/into-md-macos-arm64-core.dmg.sha256
            ${{ runner.temp }}/published-plugins/*
            ${{ runner.temp }}/installed-smoke.json
            ${{ runner.temp }}/platform-audit.json
            ${{ runner.temp }}/platform-acceptance.json
            ${{ runner.temp }}/release-metadata/*
            ${{ runner.temp }}/aarch64-apple-darwin-signing-policy.json
          if-no-files-found: error
      - name: Remove release credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id.p12" \
            "$RUNNER_TEMP/notary-key.p8" \
            "$RUNNER_TEMP/official-plugin-signing-key.pk8"
