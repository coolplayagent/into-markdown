name: Linux and Windows modular release

on:
  workflow_dispatch:
    inputs:
      plugin_base_url:
        description: HTTPS directory that will contain this target's three .imp files
        required: true
        type: string

permissions:
  contents: read

jobs:
  agent-skill:
    uses: ./.github/workflows/agent-skill-release.yml

  native-release:
    needs: agent-skill
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: into-md-linux-x86_64-core.tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: into-md-linux-arm64-core.tar.gz
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            archive: into-md-windows-x86_64-core.zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          install: make diffutils xz curl gnupg jq file binutils python coreutils perl
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install native release tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential binutils curl dpkg-dev gnupg jq xz-utils
      - name: Build and audit FFmpeg
        shell: ${{ runner.os == 'Windows' && 'msys2 {0}' || 'bash' }}
        env:
          FFMPEG_AUDIT_NETWORK: "1"
          FFMPEG_AUDIT_OUTPUT_DIR: ffmpeg-audit-output
          FFMPEG_AUDIT_PRODUCTION_SMOKE: "1"
        run: ./tools/ffmpeg-build-audit.sh
      - name: Decode protected plugin signing key
        if: runner.os == 'Linux'
        env:
          PLUGIN_SIGNING_KEY_BASE64: ${{ secrets.PLUGIN_SIGNING_KEY_BASE64 }}
        run: |
          umask 077
          test -n "$PLUGIN_SIGNING_KEY_BASE64"
          printf '%s' "$PLUGIN_SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/plugin-key.pk8"
      - name: Decode protected signing material
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PLUGIN_SIGNING_KEY_BASE64: ${{ secrets.PLUGIN_SIGNING_KEY_BASE64 }}
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:PLUGIN_SIGNING_KEY_BASE64 -or -not $env:WINDOWS_SIGNING_PFX_BASE64 -or -not $env:WINDOWS_SIGNING_PFX_PASSWORD) { throw "release signing material is absent" }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\plugin-key.pk8", [Convert]::FromBase64String($env:PLUGIN_SIGNING_KEY_BASE64))
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\release-signing.pfx", [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_SIGNING_PFX_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath "$env:RUNNER_TEMP\release-signing.pfx" -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate -or -not $certificate.Thumbprint) { throw "release certificate import failed" }
          "WINDOWS_SIGNING_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build native Rust release binaries
        shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
        run: >-
          python tools/platform-release/release.py
          --target ${{ matrix.target }}
          --build-root "${{ runner.temp }}/build"
          --build-only
      - name: Authenticode-sign project executables
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $names = @("into-md.exe", "installed-smoke.exe", "archive-check.exe", "into-md-ocr-provider.exe", "into-md-media-provider.exe", "into-md-legacy-office-provider.exe", "onnxruntime-worker.exe", "legacy-office-worker.exe")
          foreach ($name in $names) {
            & signtool.exe sign /fd SHA256 /td SHA256 /tr https://timestamp.digicert.com /sha1 $env:WINDOWS_SIGNING_THUMBPRINT "$env:RUNNER_TEMP\build\release\$name"
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed for $name" }
            & signtool.exe verify /pa /all "$env:RUNNER_TEMP\build\release\$name"
            if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed for $name" }
          }
      - name: Assemble deterministic Core and plugin packages twice
        shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
        run: |
          python tools/platform-release/release.py --target ${{ matrix.target }} --build-root "${{ runner.temp }}/build" --skip-build --cache "${{ runner.temp }}/cache" --ffmpeg-artifacts ffmpeg-audit-output --plugin-signing-key "${{ runner.temp }}/plugin-key.pk8" --plugin-base-url "${{ inputs.plugin_base_url }}/${{ matrix.target }}" --output "${{ runner.temp }}/core-a" --plugins-output "${{ runner.temp }}/plugins-a" --archive "${{ runner.temp }}/${{ matrix.archive }}.a"
          python tools/platform-release/release.py --target ${{ matrix.target }} --build-root "${{ runner.temp }}/build" --skip-build --cache "${{ runner.temp }}/cache" --ffmpeg-artifacts ffmpeg-audit-output --plugin-signing-key "${{ runner.temp }}/plugin-key.pk8" --plugin-base-url "${{ inputs.plugin_base_url }}/${{ matrix.target }}" --output "${{ runner.temp }}/core-b" --plugins-output "${{ runner.temp }}/plugins-b" --archive "${{ runner.temp }}/${{ matrix.archive }}.b"
      - name: Verify deterministic bytes
        if: runner.os == 'Linux'
        run: |
          cmp "${{ runner.temp }}/${{ matrix.archive }}.a" "${{ runner.temp }}/${{ matrix.archive }}.b"
          for package in official.ocr.ppocrv6 official.media.whisper official.legacy-office.libreoffice; do cmp "${{ runner.temp }}/plugins-a/$package.imp" "${{ runner.temp }}/plugins-b/$package.imp"; done
          mv "${{ runner.temp }}/${{ matrix.archive }}.a" "${{ runner.temp }}/${{ matrix.archive }}"
          mv "${{ runner.temp }}/${{ matrix.archive }}.a.sha256" "${{ runner.temp }}/${{ matrix.archive }}.sha256"
      - name: Verify deterministic bytes
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ((Get-FileHash "${{ runner.temp }}\${{ matrix.archive }}.a").Hash -ne (Get-FileHash "${{ runner.temp }}\${{ matrix.archive }}.b").Hash) { throw "Core ZIP is not deterministic" }
          foreach ($package in @("official.ocr.ppocrv6", "official.media.whisper", "official.legacy-office.libreoffice")) {
            if ((Get-FileHash "${{ runner.temp }}\plugins-a\$package.imp").Hash -ne (Get-FileHash "${{ runner.temp }}\plugins-b\$package.imp").Hash) { throw "$package is not deterministic" }
          }
          Remove-Item "${{ runner.temp }}\core-a", "${{ runner.temp }}\core-b", "${{ runner.temp }}\plugins-a", "${{ runner.temp }}\plugins-b" -Recurse -Force
          Remove-Item "${{ runner.temp }}\${{ matrix.archive }}.a", "${{ runner.temp }}\${{ matrix.archive }}.a.sha256", "${{ runner.temp }}\${{ matrix.archive }}.b", "${{ runner.temp }}\${{ matrix.archive }}.b.sha256" -Force
      - name: Assemble Authenticode release artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          python tools/platform-release/release.py
          --target ${{ matrix.target }}
          --build-root "${{ runner.temp }}/build"
          --skip-build
          --cache "${{ runner.temp }}/cache"
          --ffmpeg-artifacts ffmpeg-audit-output
          --plugin-signing-key "${{ runner.temp }}/plugin-key.pk8"
          --plugin-base-url "${{ inputs.plugin_base_url }}/${{ matrix.target }}"
          --output "${{ runner.temp }}/core-final"
          --plugins-output "${{ runner.temp }}/plugins-a"
          --archive "${{ runner.temp }}/${{ matrix.archive }}"
          --windows-signing-thumbprint $env:WINDOWS_SIGNING_THUMBPRINT
      - name: Clean-install and verify all capabilities
        if: runner.os == 'Linux'
        env:
          INTO_MARKDOWN_USER_DATA_HOME: ${{ runner.temp }}/clean-user-data
        run: |
          mkdir -p "$HOME/.agents/skills/existing-skill"
          printf '%s\n' 'preserve user-owned skill' > "$HOME/.agents/skills/existing-skill/SENTINEL"
          cp -R "$HOME/.agents/skills" "${{ runner.temp }}/agent-skills-before"
          mkdir "${{ runner.temp }}/distribution"
          tar -xzf "${{ runner.temp }}/${{ matrix.archive }}" -C "${{ runner.temp }}/distribution"
          "${{ runner.temp }}/distribution/bin/archive-check" "${{ runner.temp }}/distribution"
          installed=$("${{ runner.temp }}/distribution/install" "${{ runner.temp }}/install" "${{ runner.temp }}/bin" | tail -1)
          diff -ru "${{ runner.temp }}/agent-skills-before" "$HOME/.agents/skills"
          diff -ru ".agents/skills/into-markdown" "$installed/share/into-markdown/skills/into-markdown"
          signer_id=$(jq -r .signingKeyId "$installed/share/into-markdown/plugins/official-publisher.json")
          signer_sha=$(jq -r .signingKeySha256 "$installed/share/into-markdown/plugins/official-publisher.json")
          for package in official.ocr.ppocrv6 official.media.whisper official.legacy-office.libreoffice; do
            sha=$(sha256sum "${{ runner.temp }}/plugins-a/$package.imp" | awk '{print $1}')
            "$installed/bin/into-md" plugins install "${{ runner.temp }}/plugins-a/$package.imp" --sha256 "$sha" --signing-key-id "$signer_id" --signing-key-sha256 "$signer_sha" --scope global
            "$installed/bin/into-md" plugins verify "$package" --scope global
          done
          "$installed/bin/into-md" capabilities list --json | jq -e '[.capabilities[] | select(.status == "ready")] | length == 4'
          "$installed/bin/into-md" "${{ github.workspace }}/tools/macos-release/fixtures/normal.doc" --output "${{ runner.temp }}/legacy-output" --format doc
          "${{ runner.temp }}/distribution/uninstall" "${{ runner.temp }}/install" "${{ runner.temp }}/bin"
          diff -ru "${{ runner.temp }}/agent-skills-before" "$HOME/.agents/skills"
      - name: Clean-install and verify all capabilities
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          INTO_MARKDOWN_USER_DATA_HOME: ${{ runner.temp }}\clean-user-data
        run: |
          $agentSkills = "$HOME\.agents\skills"
          New-Item -ItemType Directory -Force "$agentSkills\existing-skill" | Out-Null
          Set-Content -NoNewline "$agentSkills\existing-skill\SENTINEL" "preserve user-owned skill"
          function Get-AgentSkillTree([string]$Root) {
            Get-ChildItem $Root -Force -Recurse | Sort-Object FullName | ForEach-Object {
              $relative = $_.FullName.Substring($Root.Length)
              if ($_.PSIsContainer) {
                "$relative|directory"
              } else {
                "$relative|file|$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash)"
              }
            }
          }
          $agentSkillsBefore = @(Get-AgentSkillTree $agentSkills)
          Expand-Archive -LiteralPath "${{ runner.temp }}\${{ matrix.archive }}" -DestinationPath "${{ runner.temp }}\distribution"
          & "${{ runner.temp }}\distribution\bin\archive-check.exe" "${{ runner.temp }}\distribution"
          & "${{ runner.temp }}\distribution\Install.ps1" -Prefix "${{ runner.temp }}\install" -CommandDirectory "${{ runner.temp }}\bin"
          if (Compare-Object $agentSkillsBefore @(Get-AgentSkillTree $agentSkills)) { throw "Core installer modified the Agent Skills directory" }
          $installed = Get-ChildItem "${{ runner.temp }}\install\versions" | Select-Object -First 1 -ExpandProperty FullName
          $canonical = Get-ChildItem ".agents\skills\into-markdown" -File -Recurse | ForEach-Object { [PSCustomObject]@{ Path = $_.FullName.Substring((Resolve-Path ".agents\skills\into-markdown").Path.Length); Hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash } }
          $embedded = Get-ChildItem "$installed\share\into-markdown\skills\into-markdown" -File -Recurse | ForEach-Object { [PSCustomObject]@{ Path = $_.FullName.Substring((Resolve-Path "$installed\share\into-markdown\skills\into-markdown").Path.Length); Hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash } }
          if (Compare-Object $canonical $embedded -Property Path, Hash) { throw "embedded Agent Skill differs from canonical source" }
          $catalog = Get-Content "$installed\share\into-markdown\plugins\official-publisher.json" | ConvertFrom-Json
          foreach ($package in @("official.ocr.ppocrv6", "official.media.whisper", "official.legacy-office.libreoffice")) {
            $path = "${{ runner.temp }}\plugins-a\$package.imp"
            $sha = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
            & "$installed\bin\into-md.exe" plugins install $path --sha256 $sha --signing-key-id $catalog.signingKeyId --signing-key-sha256 $catalog.signingKeySha256 --scope global
            & "$installed\bin\into-md.exe" plugins verify $package --scope global
          }
          $ready = (& "$installed\bin\into-md.exe" capabilities list --json | ConvertFrom-Json).capabilities | Where-Object status -eq "ready"
          if ($ready.Count -ne 4) { throw "not all capabilities are ready" }
          & "$installed\bin\into-md.exe" "${{ github.workspace }}\tools\macos-release\fixtures\normal.doc" --output "${{ runner.temp }}\legacy-output" --format doc
          & "${{ runner.temp }}\distribution\Uninstall.ps1" -Prefix "${{ runner.temp }}\install" -CommandDirectory "${{ runner.temp }}\bin"
          if (Compare-Object $agentSkillsBefore @(Get-AgentSkillTree $agentSkills)) { throw "Core uninstaller modified the Agent Skills directory" }
      - name: Sign Linux release artifacts
        if: runner.os == 'Linux'
        env:
          RELEASE_GPG_PRIVATE_KEY_BASE64: ${{ secrets.RELEASE_GPG_PRIVATE_KEY_BASE64 }}
          RELEASE_GPG_KEY_FINGERPRINT: ${{ secrets.RELEASE_GPG_KEY_FINGERPRINT }}
        run: |
          test -n "$RELEASE_GPG_PRIVATE_KEY_BASE64" && test -n "$RELEASE_GPG_KEY_FINGERPRINT"
          export GNUPGHOME="${{ runner.temp }}/release-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$RELEASE_GPG_PRIVATE_KEY_BASE64" | base64 --decode | gpg --batch --import
          test "$(gpg --batch --with-colons --fingerprint "$RELEASE_GPG_KEY_FINGERPRINT" | awk -F: '$1 == "fpr" {print $10; exit}')" = "$RELEASE_GPG_KEY_FINGERPRINT"
          for artifact in "${{ runner.temp }}/${{ matrix.archive }}" "${{ runner.temp }}/plugins-a/"*.imp; do gpg --batch --local-user "$RELEASE_GPG_KEY_FINGERPRINT" --detach-sign --armor "$artifact"; done
      - uses: actions/upload-artifact@v4
        with:
          name: modular-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/${{ matrix.archive }}
            ${{ runner.temp }}/${{ matrix.archive }}.sha256
            ${{ runner.temp }}/${{ matrix.archive }}.asc
            ${{ runner.temp }}/plugins-a/*.imp
            ${{ runner.temp }}/plugins-a/*.sha256
            ${{ runner.temp }}/plugins-a/*.asc
          if-no-files-found: error
      - name: Remove Windows signing credentials
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:WINDOWS_SIGNING_THUMBPRINT) {
            Remove-Item "Cert:\CurrentUser\My\$env:WINDOWS_SIGNING_THUMBPRINT" -Force -ErrorAction SilentlyContinue
          }
          Remove-Item "$env:RUNNER_TEMP\release-signing.pfx" -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:RUNNER_TEMP\plugin-key.pk8" -Force -ErrorAction SilentlyContinue
