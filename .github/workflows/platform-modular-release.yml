name: Into Markdown release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag, for example 0.0.6
        required: true
        default: 0.0.6
        type: string
      build_only:
        description: Build and aggregate all targets without creating or changing a GitHub Release
        required: true
        default: false
        type: boolean
      signing_mode:
        description: Optional operating-system publisher signatures
        required: true
        default: unsigned
        type: choice
        options: [unsigned, signed]

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    if: inputs.build_only || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    environment: ${{ inputs.build_only && 'release-validation' || 'release' }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    env:
      INTO_MD_RELEASE_STREAM_LOGS: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            runner: ubuntu-24.04
            container: docker.io/rockylinux/rockylinux:8.10@sha256:e8a49c5403b687db05d4d67333fa45808fbe74f36e683cec7abb1f7d0f2338c6
            target: x86_64-unknown-linux-gnu
            timeout_minutes: 30
          - label: Linux ARM64
            runner: ubuntu-24.04-arm
            container: docker.io/rockylinux/rockylinux:8.10@sha256:e8a49c5403b687db05d4d67333fa45808fbe74f36e683cec7abb1f7d0f2338c6
            target: aarch64-unknown-linux-gnu
            timeout_minutes: 30
          - label: Windows x86_64
            runner: windows-2025
            container: ''
            target: x86_64-pc-windows-msvc
            timeout_minutes: 30
          - label: macOS Apple Silicon
            runner: macos-14
            container: ''
            target: aarch64-apple-darwin
            timeout_minutes: 30
    steps:
      - name: Bootstrap fixed Linux container
        if: runner.os == 'Linux'
        run: |
          dnf install --assumeyes binutils clang-libs cmake curl file gcc gcc-c++ git gnupg2 gzip jq make openssl patch perl pkgconf-pkg-config python3.11 tar which xz
          if [ "$(uname -m)" = x86_64 ]; then
            dnf --enablerepo=powertools install --assumeyes gcc-toolset-15-gcc gcc-toolset-15-gcc-c++ nasm
            toolset_bin=/opt/rh/gcc-toolset-15/root/usr/bin
            test -x "$toolset_bin/gcc"
            test -x "$toolset_bin/g++"
            test "$("$toolset_bin/gcc" -dumpversion | cut -d. -f1)" = 15
            c_probe="$(mktemp)"
            cxx_probe="$(mktemp)"
            trap 'rm -f "$c_probe" "$cxx_probe"' EXIT
            printf 'int into_md_cpu_variant_probe(void) { return 0; }\n' |
              "$toolset_bin/gcc" -x c -c -o "$c_probe" -mavxvnni -mavx512vnni -mavx512bf16 -mamx-tile -mamx-int8 -
            printf 'int into_md_cpu_variant_probe() { return 0; }\n' |
              "$toolset_bin/g++" -x c++ -c -o "$cxx_probe" -mavxvnni -mavx512vnni -mavx512bf16 -mamx-tile -mamx-int8 -
            echo "CC=$toolset_bin/gcc" >> "$GITHUB_ENV"
            echo "CXX=$toolset_bin/g++" >> "$GITHUB_ENV"
          fi
          ln -sf /usr/bin/python3.11 /usr/local/bin/python
          ln -sf /usr/bin/python3.11 /usr/local/bin/python3
          libclang_path="$(rpm -ql clang-libs | grep -E '/libclang\.so(\.[0-9]+)*$' | head -n 1)"
          test -f "$libclang_path"
          echo "LIBCLANG_PATH=$(dirname "$libclang_path")" >> "$GITHUB_ENV"
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: '3.13'
      - name: Bind Linux checkout ownership
        if: runner.os == 'Linux'
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Validate release identity
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python - <<'PY'
          import os, pathlib, re, tomllib
          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,127}", tag):
              raise SystemExit("release tag must be a bounded URL-safe Git ref component")
          version = tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))["workspace"]["package"]["version"]
          if tag.removeprefix("v") != version:
              raise SystemExit(f"release tag {tag!r} does not match workspace version {version!r}")
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - uses: actions/cache/restore@v4
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
          key: release-cargo-registry-v1-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: ${{ runner.temp }}/release-work/cache
          key: release-native-inputs-v1-${{ matrix.target }}-${{ hashFiles('tools/platform-release/authority.json', 'tools/macos-release/authority.json') }}
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          toolset: 14.44.35207
          sdk: 10.0.26100.0
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          install: openssl
      - name: Install macOS native audit tools
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Bind CMake to MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"CMAKE_GENERATOR=NMake Makefiles" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
      - name: Import Windows publisher certificate
        if: runner.os == 'Windows' && inputs.signing_mode == 'signed'
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_SIGNING_PFX_BASE64 -or -not $env:WINDOWS_SIGNING_PFX_PASSWORD) { throw "Windows signing material is absent" }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\release-signing.pfx", [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_SIGNING_PFX_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath "$env:RUNNER_TEMP\release-signing.pfx" -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate.Thumbprint) { throw "release certificate import failed" }
          "WINDOWS_SIGNING_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Import Apple publisher credentials
        if: runner.os == 'macOS' && inputs.signing_mode == 'signed'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          RELEASE_KEYCHAIN_PASSWORD: ${{ secrets.RELEASE_KEYCHAIN_PASSWORD }}
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
        run: |
          test -n "$APPLE_CERTIFICATE_P12_BASE64" && test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_NOTARY_KEY_BASE64" && test -n "$RELEASE_KEYCHAIN_PASSWORD"
          test -n "$APPLE_CODESIGN_IDENTITY"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$APPLE_NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          security create-keychain -p "$RELEASE_KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          security unlock-keychain -p "$RELEASE_KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$RUNNER_TEMP/release.keychain-db" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RELEASE_KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/release.keychain-db"
          echo "APPLE_CODESIGN_IDENTITY=$APPLE_CODESIGN_IDENTITY" >> "$GITHUB_ENV"
      - name: Acquire pinned audited FFmpeg runtime
        shell: bash
        run: |
          python tools/release_timing.py run \
            --report "$RUNNER_TEMP/release-timings.json" \
            --target "${{ matrix.target }}" \
            --phase ffmpeg-acquire -- \
            python tools/ffmpeg_runtime.py acquire \
              --target "${{ matrix.target }}" \
              --output "$RUNNER_TEMP/ffmpeg-audit-output"
      - name: Generate ephemeral plugin integrity key
        if: runner.os != 'Windows'
        run: openssl genpkey -algorithm ED25519 -outform DER -out "$RUNNER_TEMP/plugin-integrity-key.pk8"
      - name: Generate ephemeral plugin integrity key on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: openssl genpkey -algorithm ED25519 -outform DER -out "$RUNNER_TEMP/plugin-integrity-key.pk8"
      - name: Bind Cargo to the pinned MSVC linker
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $linker = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64\link.exe'
          if (-not (Test-Path -LiteralPath $linker -PathType Leaf)) {
            throw "Pinned MSVC linker is unavailable: $linker"
          }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build and verify compact Core and speech once
        shell: bash
        env:
          PLUGIN_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ inputs.release_tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-output"
          signing=()
          if [ "${{ matrix.target }}" = x86_64-pc-windows-msvc ] && [ "${{ inputs.signing_mode }}" = signed ]; then
            signing=(--windows-signing-thumbprint "$WINDOWS_SIGNING_THUMBPRINT")
          elif [ "${{ matrix.target }}" = aarch64-apple-darwin ]; then
            identity=-
            if [ "${{ inputs.signing_mode }}" = signed ]; then
              identity="$APPLE_CODESIGN_IDENTITY"
            fi
            signing=(--codesign-identity "$identity")
          fi
          python tools/portable-release/assemble.py build \
            --target "${{ matrix.target }}" \
            --output "$RUNNER_TEMP/release-output" \
            --work-root "$RUNNER_TEMP/release-work" \
            --ffmpeg-artifacts "$RUNNER_TEMP/ffmpeg-audit-output" \
            --plugin-signing-key "$RUNNER_TEMP/plugin-integrity-key.pk8" \
            --plugin-base-url "$PLUGIN_BASE_URL" \
            --timings "$RUNNER_TEMP/release-timings.json" \
            "${signing[@]}"
          python tools/portable-release/assemble.py verify \
            --target "${{ matrix.target }}" \
            --output "$RUNNER_TEMP/release-output"
          python tools/release_timing.py run \
            --report "$RUNNER_TEMP/release-timings.json" \
            --target "${{ matrix.target }}" \
            --phase native-e2e -- \
            python tools/portable-release/native_acceptance.py \
              --target "${{ matrix.target }}" \
              --output "$RUNNER_TEMP/release-output" \
              --expected-version "${{ inputs.release_tag }}"
          cp "$RUNNER_TEMP/release-timings.json" \
            "$RUNNER_TEMP/release-output/evidence/${{ matrix.target }}/release-timings.json"
      - name: Sign and notarize final macOS downloads
        if: runner.os == 'macOS' && inputs.signing_mode == 'signed'
        env:
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          core="$RUNNER_TEMP/release-output/release/into-md-macos-arm64.zip"
          speech="$RUNNER_TEMP/release-output/release/official.media.whisper-${{ matrix.target }}.imp"
          cp "$speech" "$RUNNER_TEMP/macos-speech-notary.zip"
          for archive in "$core" "$RUNNER_TEMP/macos-speech-notary.zip"; do
            xcrun notarytool submit "$archive" --key "$RUNNER_TEMP/notary-key.p8" \
              --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID" --wait
          done
      - name: Start artifact upload timing
        shell: bash
        run: python tools/release_timing.py mark --marker "$RUNNER_TEMP/artifact-upload.started"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ runner.temp }}/release-output
          if-no-files-found: error
          retention-days: 7
      - name: Record artifact upload timing
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/artifact-upload.started"; then
            python tools/release_timing.py finish \
              --report "$RUNNER_TEMP/release-timings.json" \
              --target "${{ matrix.target }}" \
              --phase artifact-upload \
              --marker "$RUNNER_TEMP/artifact-upload.started"
          fi
      - name: Start cache upload timing
        if: success()
        shell: bash
        run: python tools/release_timing.py mark --marker "$RUNNER_TEMP/cache-upload.started"
      - uses: actions/cache/save@v4
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
          key: release-cargo-registry-v1-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/release-work/cache
          key: release-native-inputs-v1-${{ matrix.target }}-${{ hashFiles('tools/platform-release/authority.json', 'tools/macos-release/authority.json') }}
      - name: Record cache upload timing and publish summary
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/cache-upload.started"; then
            python tools/release_timing.py finish \
              --report "$RUNNER_TEMP/release-timings.json" \
              --target "${{ matrix.target }}" \
              --phase cache-upload \
              --marker "$RUNNER_TEMP/cache-upload.started"
          fi
          if test -f "$RUNNER_TEMP/release-timings.json"; then
            python tools/release_timing.py summary \
              --report "$RUNNER_TEMP/release-timings.json" \
              --target "${{ matrix.target }}" \
              --output "$GITHUB_STEP_SUMMARY"
            mkdir -p "$RUNNER_TEMP/release-output/evidence/${{ matrix.target }}"
            cp "$RUNNER_TEMP/release-timings.json" \
              "$RUNNER_TEMP/release-output/evidence/${{ matrix.target }}/release-timings.json"
          fi
      - name: Upload machine-readable release timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timing-${{ matrix.target }}
          path: ${{ runner.temp }}/release-timings.json
          if-no-files-found: warn
          retention-days: 30
      - name: Remove Windows credentials
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:WINDOWS_SIGNING_THUMBPRINT) { Remove-Item "Cert:\CurrentUser\My\$env:WINDOWS_SIGNING_THUMBPRINT" -Force -ErrorAction SilentlyContinue }
          Remove-Item "$env:RUNNER_TEMP\release-signing.pfx" -Force -ErrorAction SilentlyContinue
      - name: Remove Apple credentials
        if: always() && runner.os == 'macOS' && inputs.signing_mode == 'signed'
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary-key.p8"
      - name: Remove ephemeral plugin integrity key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/plugin-integrity-key.pk8"

  windows-release-e2e:
    name: Aggregate and black-box Windows Core and Skill
    needs: build
    runs-on: windows-2025
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: ${{ runner.temp }}/targets
      - name: Aggregate the reviewed Core inputs into the Skill
        shell: pwsh
        run: |
          $publish = "$env:RUNNER_TEMP\publish"
          $windows = "$env:RUNNER_TEMP\skill-input\windows"
          $linuxX64 = "$env:RUNNER_TEMP\skill-input\linux-x86_64"
          $linuxArm64 = "$env:RUNNER_TEMP\skill-input\linux-arm64"
          New-Item -ItemType Directory -Force $publish, $windows, $linuxX64, $linuxArm64 | Out-Null
          Expand-Archive "$env:RUNNER_TEMP\targets\release-x86_64-pc-windows-msvc\release\into-md-windows-x86_64.zip" $windows
          Expand-Archive "$env:RUNNER_TEMP\targets\release-x86_64-unknown-linux-gnu\release\into-md-linux-x86_64.zip" $linuxX64
          Expand-Archive "$env:RUNNER_TEMP\targets\release-aarch64-unknown-linux-gnu\release\into-md-linux-arm64.zip" $linuxArm64
          $windowsAuthority = "$env:RUNNER_TEMP\targets\release-x86_64-pc-windows-msvc\evidence\x86_64-pc-windows-msvc\core\archive-material-authority.json"
          $linuxX64Authority = "$env:RUNNER_TEMP\targets\release-x86_64-unknown-linux-gnu\evidence\x86_64-unknown-linux-gnu\core\archive-material-authority.json"
          $linuxArm64Authority = "$env:RUNNER_TEMP\targets\release-aarch64-unknown-linux-gnu\evidence\aarch64-unknown-linux-gnu\core\archive-material-authority.json"
          $skillAuthority = "$env:RUNNER_TEMP\targets\release-x86_64-pc-windows-msvc\evidence\release-validation\into-markdown-skill-authority.json"
          python tools/skill-release/skill_release_main.py build `
            --windows-x86-64-core "$windows\into-md.exe" `
            --windows-x86-64-pdfium "$windows\lib\pdfium\pdfium.dll" `
            --linux-x86-64-core "$linuxX64\into-md" `
            --linux-arm64-core "$linuxArm64\into-md" `
            --windows-material-authority $windowsAuthority `
            --linux-x86-64-material-authority $linuxX64Authority `
            --linux-arm64-material-authority $linuxArm64Authority `
            --authority-output $skillAuthority `
            --archive "$publish\into-markdown-skill.zip"
          python tools/skill-release/skill_release_main.py verify `
            --archive "$publish\into-markdown-skill.zip" `
            --skill-authority $skillAuthority
          Copy-Item "$env:RUNNER_TEMP\targets\release-x86_64-pc-windows-msvc\release\into-md-windows-x86_64.zip" $publish
          Copy-Item "$env:RUNNER_TEMP\targets\release-x86_64-pc-windows-msvc\release\official.media.whisper-x86_64-pc-windows-msvc.imp" $publish
      - name: Run offline Windows Core and Skill black-box E2E
        shell: pwsh
        run: |
          python tools/portable-release/post_release_e2e.py `
            --platform windows `
            --assets-dir "$env:RUNNER_TEMP\publish" `
            --evidence-dir "$env:RUNNER_TEMP\targets\release-x86_64-pc-windows-msvc\evidence" `
            --fixtures fixtures `
            --work-root "$env:RUNNER_TEMP\post-release-e2e" `
            --report "$env:RUNNER_TEMP\post-release-e2e.json" `
            --version "${{ inputs.release_tag }}" `
            --tag "${{ inputs.release_tag }}"
      - name: Upload Windows release validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-e2e
          path: ${{ runner.temp }}/post-release-e2e.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Aggregate and validate 10 downloads
    needs: [build, windows-release-e2e]
    runs-on: ubuntu-24.04
    environment: ${{ inputs.build_only && 'release-validation' || 'release' }}
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: ${{ runner.temp }}/targets
      - uses: actions/download-artifact@v4
        with:
          name: windows-release-e2e
          path: ${{ runner.temp }}/evidence/release-validation
      - name: Build one cross-platform Agent Skill
        run: |
          mkdir -p "$RUNNER_TEMP/publish" "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/skill-input/windows" "$RUNNER_TEMP/skill-input/linux-x86_64" "$RUNNER_TEMP/skill-input/linux-arm64"
          python -m zipfile -e "$RUNNER_TEMP/targets/release-x86_64-pc-windows-msvc/release/into-md-windows-x86_64.zip" "$RUNNER_TEMP/skill-input/windows"
          python -m zipfile -e "$RUNNER_TEMP/targets/release-x86_64-unknown-linux-gnu/release/into-md-linux-x86_64.zip" "$RUNNER_TEMP/skill-input/linux-x86_64"
          python -m zipfile -e "$RUNNER_TEMP/targets/release-aarch64-unknown-linux-gnu/release/into-md-linux-arm64.zip" "$RUNNER_TEMP/skill-input/linux-arm64"
          python tools/skill-release/skill_release_main.py build \
            --windows-x86-64-core "$RUNNER_TEMP/skill-input/windows/into-md.exe" \
            --windows-x86-64-pdfium "$RUNNER_TEMP/skill-input/windows/lib/pdfium/pdfium.dll" \
            --linux-x86-64-core "$RUNNER_TEMP/skill-input/linux-x86_64/into-md" \
            --linux-arm64-core "$RUNNER_TEMP/skill-input/linux-arm64/into-md" \
            --windows-material-authority "$RUNNER_TEMP/targets/release-x86_64-pc-windows-msvc/evidence/x86_64-pc-windows-msvc/core/archive-material-authority.json" \
            --linux-x86-64-material-authority "$RUNNER_TEMP/targets/release-x86_64-unknown-linux-gnu/evidence/x86_64-unknown-linux-gnu/core/archive-material-authority.json" \
            --linux-arm64-material-authority "$RUNNER_TEMP/targets/release-aarch64-unknown-linux-gnu/evidence/aarch64-unknown-linux-gnu/core/archive-material-authority.json" \
            --authority-output "$RUNNER_TEMP/evidence/release-validation/into-markdown-skill-authority.json" \
            --archive "$RUNNER_TEMP/publish/into-markdown-skill.zip"
          python tools/skill-release/skill_release_main.py verify \
            --archive "$RUNNER_TEMP/publish/into-markdown-skill.zip" \
            --skill-authority "$RUNNER_TEMP/evidence/release-validation/into-markdown-skill-authority.json"
      - name: Collect four Core and four speech downloads
        run: |
          for directory in "$RUNNER_TEMP"/targets/release-*; do
            cp "$directory"/release/into-md-*.zip "$RUNNER_TEMP/publish/"
            cp "$directory"/release/official.media.whisper-*.imp "$RUNNER_TEMP/publish/"
            cp -R "$directory"/evidence/* "$RUNNER_TEMP/evidence/"
          done
          test "$(find "$RUNNER_TEMP/publish" -maxdepth 1 -type f -name 'into-md-*.zip' | wc -l)" -eq 4
          test "$(find "$RUNNER_TEMP/publish" -maxdepth 1 -type f -name 'official.media.whisper-*.imp' | wc -l)" -eq 4
          test -f "$RUNNER_TEMP/publish/into-markdown-skill.zip"
      - name: Run published Linux Core and Skill black-box E2E
        run: |
          python tools/portable-release/post_release_e2e.py \
            --platform linux \
            --assets-dir "$RUNNER_TEMP/publish" \
            --evidence-dir "$RUNNER_TEMP/evidence" \
            --fixtures fixtures \
            --work-root "$RUNNER_TEMP/post-release-e2e" \
            --report "$RUNNER_TEMP/post-release-e2e.json" \
            --version "${{ inputs.release_tag }}" \
            --tag "${{ inputs.release_tag }}"
          mkdir -p "$RUNNER_TEMP/evidence/release-validation"
          cp "$RUNNER_TEMP/post-release-e2e.json" \
            "$RUNNER_TEMP/evidence/release-validation/linux-x86_64.json"
      - name: Build one audit download
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib
          publish = pathlib.Path(os.environ["RUNNER_TEMP"]) / "publish"
          evidence = pathlib.Path(os.environ["RUNNER_TEMP"]) / "evidence"
          expected = {
              "into-md-windows-x86_64.zip",
              "into-md-linux-x86_64.zip",
              "into-md-linux-arm64.zip",
              "into-md-macos-arm64.zip",
              "official.media.whisper-x86_64-pc-windows-msvc.imp",
              "official.media.whisper-x86_64-unknown-linux-gnu.imp",
              "official.media.whisper-aarch64-unknown-linux-gnu.imp",
              "official.media.whisper-aarch64-apple-darwin.imp",
              "into-markdown-skill.zip",
          }
          actual = {path.name for path in publish.iterdir() if path.is_file()}
          if actual != expected:
              raise SystemExit(
                  f"unexpected public product set before audit: missing={sorted(expected - actual)}, "
                  f"extra={sorted(actual - expected)}"
              )
          def digest(path):
              value = hashlib.sha256()
              with path.open("rb") as source:
                  for block in iter(lambda: source.read(1024 * 1024), b""):
                      value.update(block)
              return value.hexdigest()
          files = []
          for path in sorted(publish.iterdir(), key=lambda item: item.name):
              if path.is_file():
                  files.append({
                      "name": path.name,
                      "bytes": path.stat().st_size,
                      "sha256": digest(path),
                  })
          (evidence / "release-set.json").write_text(
              json.dumps({"schemaVersion": 1, "files": files}, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          python tools/release_evidence.py \
            --source "$RUNNER_TEMP/evidence" \
            --output "$RUNNER_TEMP/publish/into-markdown-${{ inputs.release_tag }}-audit.zip" \
            --source-revision "${{ github.sha }}"
          python - <<'PY'
          import os, pathlib
          publish = pathlib.Path(os.environ["RUNNER_TEMP"]) / "publish"
          expected = {
              "into-md-windows-x86_64.zip",
              "into-md-linux-x86_64.zip",
              "into-md-linux-arm64.zip",
              "into-md-macos-arm64.zip",
              "official.media.whisper-x86_64-pc-windows-msvc.imp",
              "official.media.whisper-x86_64-unknown-linux-gnu.imp",
              "official.media.whisper-aarch64-unknown-linux-gnu.imp",
              "official.media.whisper-aarch64-apple-darwin.imp",
              "into-markdown-skill.zip",
              f"into-markdown-{os.environ['RELEASE_TAG']}-audit.zip",
          }
          actual = {path.name for path in publish.iterdir() if path.is_file()}
          if actual != expected:
              raise SystemExit(
                  f"unexpected final release set: missing={sorted(expected - actual)}, "
                  f"extra={sorted(actual - expected)}"
              )
          PY
      - name: Record build-only result
        if: ${{ inputs.build_only }}
        run: |
          {
            echo '### Build-only release validation'
            echo
            echo 'All four platform artifacts, the bundled Skill, and the audit archive were assembled and validated.'
            echo 'No GitHub Release was created, edited, deleted, or uploaded.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Create or update draft release
        if: ${{ !inputs.build_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SIGNING_MODE: ${{ inputs.signing_mode }}
        run: |
          if [ "$SIGNING_MODE" = unsigned ]; then
            title="Into Markdown $RELEASE_TAG [UNSIGNED]"
            trust_note="These builds are installable but may show an operating-system trust warning."
          else
            title="Into Markdown $RELEASE_TAG"
            trust_note="Operating-system publisher signatures are enabled."
          fi
          notes=$(cat <<EOF
          Download one Core file for your computer and run it directly:
          - Windows x86_64: into-md-windows-x86_64.zip
          - macOS Apple Silicon: into-md-macos-arm64.zip
          - Linux x86_64: into-md-linux-x86_64.zip
          - Linux ARM64: into-md-linux-arm64.zip

          OCR is already included in Core. Speech is optional; download the matching official.media.whisper .imp only if needed. Agent users download into-markdown-skill.zip. The audit ZIP is for auditors. GitHub provides source archives automatically. $trust_note
          EOF
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --draft --target "${{ github.sha }}" --title "$title" --notes "$notes"
          fi
          gh release edit "$RELEASE_TAG" --target "${{ github.sha }}" --title "$title" --notes "$notes"
          for old_asset in $(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name'); do
            gh release delete-asset "$RELEASE_TAG" "$old_asset" --yes
          done
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/publish"/*
